<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EXCEL DENEME SINAVI</title>
<style>
:root{--primary:#e67e22;--success:#2ecc71;--error:#e74c3c;--bg:#f8f9fa}
body{font-family:sans-serif;background:var(--bg);margin:0;padding:20px}
.container{max-width:800px;margin:0 auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.cover{text-align:center;margin-bottom:15px;padding:10px;background:linear-gradient(135deg,#e67e22 0%,#d35400 100%);border-radius:15px;color:white;min-height:auto}
.cover img{max-width:200px;border-radius:10px;margin-bottom:15px}
.question{margin-bottom:30px;padding:20px;border:2px solid #eee;border-radius:12px;border-left:6px solid var(--primary)}
.q-text{font-size:18px;font-weight:bold;margin-bottom:15px;color:#333}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{padding:15px;border:2px solid #ddd;border-radius:8px;cursor:pointer;transition:all 0.3s;background:#f9f9f9}
.option:hover{border-color:var(--primary);background:#f0f0f0}
.option.correct{border-color:var(--success);background:#d4edda}
.option.wrong{border-color:var(--error);background:#f8d7da}
.option img{max-width:80px;max-height:60px;display:block;margin-top:5px}
.progress{text-align:center;margin-bottom:20px;color:#666;font-size:16px}
.result{text-align:center;padding:30px}
.result.success{color:var(--success)}
.result.fail{color:var(--error)}
.email-form{background:#fff3e0;padding:30px;border-radius:12px;margin-top:30px}
.email-form h2{color:#d35400;margin-bottom:20px}
.email-form input,.email-form textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-family:inherit}
.email-form label{font-weight:bold;display:block;margin-top:15px}
.email-form button{background:var(--primary);color:white;padding:15px 40px;font-size:18px;border:none;border-radius:8px;cursor:pointer;margin-top:20px}
.email-form button:hover{background:#d35400}
#zoomModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
#zoomModal img{max-width:90%;max-height:90%}
img{cursor:pointer;transition:transform 0.3s;max-width:100%;max-height:200px;border-radius:8px}
img:hover{transform:scale(1.02)}
.hidden{display:none}
</style>
</head>

var c=0,s=0,a=[];
var web3Key="9d8bb405-a063-415d-915c-db97bf0a4fc9";

function openZoom(src){document.getElementById('zoomImg').src=src;document.getElementById('zoomModal').style.display='flex'}
function showQ(){
if(c>=d.length){showEmailForm();return}
var h='<div class="question">';
h+='<div class="q-text">Soru '+(c+1)+': '+d[c].q+'</div>';
if(d[c].qImgData) h+='<img src="'+d[c].qImgData+'" onclick="openZoom(this.src)"><br>';
h+='<div class="options">';
h+='<div class="option" onclick="check(String.fromCharCode(65))">A) '+d[c].optA.text+(d[c].optA.imgData?' <img src="'+d[c].optA.imgData+'" onclick="event.stopPropagation();openZoom(this.src)">':'')+'</div>';
h+='<div class="option" onclick="check(String.fromCharCode(66))">B) '+d[c].optB.text+(d[c].optB.imgData?' <img src="'+d[c].optB.imgData+'" onclick="event.stopPropagation();openZoom(this.src)">':'')+'</div>';
h+='<div class="option" onclick="check(String.fromCharCode(67))">C) '+d[c].optC.text+(d[c].optC.imgData?' <img src="'+d[c].optC.imgData+'" onclick="event.stopPropagation();openZoom(this.src)">':'')+'</div>';
h+='<div class="option" onclick="check(String.fromCharCode(68))">D) '+d[c].optD.text+(d[c].optD.imgData?' <img src="'+d[c].optD.imgData+'" onclick="event.stopPropagation();openZoom(this.src)">':'')+'</div>';
h+='</div>';
h+='</div>';
document.getElementById('quiz').innerHTML=h;
}
function check(ans){
var opts=document.querySelectorAll('.option');
opts.forEach(function(o){o.style.pointerEvents='none'});
var dogruMu=ans===d[c].correct;
if(dogruMu){opts[['A','B','C','D'].indexOf(ans)].classList.add('correct');s++}
else{opts[['A','B','C','D'].indexOf(ans)].classList.add('wrong');opts[['A','B','C','D'].indexOf(d[c].correct)].classList.add('correct')}
a.push({soru:c+1,verilen:ans,dogru:d[c].correct,sonuc:dogruMu?'Dogru':'Yanlis'});
setTimeout(function(){c++;showQ()},1500);
}
function showEmailForm(){
var p=Math.round(s/d.length*100);
var cevapDetaylari='';
a.forEach(function(cevap){
cevapDetaylari+='Soru '+cevap.soru+': Verilen='+cevap.verilen+', Dogru='+cevap.dogru+' ('+cevap.sonuc+')\n';
});

var html='<div class="email-form">';
html+='<h2>📧 Test Tamamlandi! Sonuclari Gonder</h2>';
html+='<p><strong>Sonuc Ozeti:</strong></p>';
html+='<p>Dogru: '+s+' / '+d.length+' ('+p+'%)</p>';
html+='<hr>';
html+='<form id="sonucFormu">';
html+='<label>Adiniz:</label>';
html+='<input type="text" name="ogrenci_ad" id="ogrenci_ad" placeholder="Adinizi girin" required>';
html+='<label>Soyadiniz:</label>';
html+='<input type="text" name="ogrenci_soyad" id="ogrenci_soyad" placeholder="Soyadinizi girin" required>';
html+='<label>Email Adresiniz:</label>';
html+='<input type="email" name="ogrenci_email" id="ogrenci_email" placeholder="email@ornek.com" required>';
html+='<label>Aciklama (Istege Bagli):</label>';
html+='<textarea name="aciklama" id="aciklama" rows="3" placeholder="Eklemek istediginiz bir sey var mi?"></textarea>';
html+='<button type="button" onclick="sendToWeb3Forms()">📧 SONUCLARI GONDER</button>';
html+='</form>';
html+='<div id="formSonuc" style="margin-top:20px;display:none;"></div>';
html+='</div>';
document.getElementById('quiz').innerHTML=html;
}

function sendToWeb3Forms(){
var ad=document.getElementById('ogrenci_ad').value.trim();
var soyad=document.getElementById('ogrenci_soyad').value.trim();
var email=document.getElementById('ogrenci_email').value.trim();
var aciklama=document.getElementById('aciklama').value.trim();

if(!ad||!soyad||!email){alert('Lutfen ad, soyad ve email adresinizi girin!');return;}

var p=Math.round(s/d.length*100);
var cevapDetaylari='';
a.forEach(function(cevap){
cevapDetaylari+='Soru '+cevap.soru+': Verilen='+cevap.verilen+', Dogru='+cevap.dogru+' ('+cevap.sonuc+')\n';
});

var mesaj='TEST SONUCLARI\n\n';
mesaj+='Test: EXCEL DENEME SINAVI\n';
mesaj+='Ogrenci: '+ad+' '+soyad+'\n';
mesaj+='Ogrenci Email: '+email+'\n';
if(aciklama) mesaj+='Aciklama: '+aciklama+'\n';
mesaj+='\nSONUC OZETI\n';
mesaj+='===========\n';
mesaj+='Dogru Sayisi: '+s+'\n';
mesaj+='Yanlis Sayisi: '+(d.length-s)+'\n';
mesaj+='Toplam Soru: '+d.length+'\n';
mesaj+='Basari Orani: '+p+'%\n\n';
mesaj+='DETAYLI CEVAPLAR\n';
mesaj+='================\n';
mesaj+=cevapDetaylari;

var formData=new FormData();
formData.append('access_key', web3Key);
formData.append('subject', 'Test Sonuclari: '+ad+' '+soyad);
formData.append('from_name', ad+' '+soyad);
formData.append('email', email);
if(teacherEmail) formData.append('replyto', teacherEmail);
formData.append('message', mesaj);

var xhr=new XMLHttpRequest();
xhr.open('POST', 'https://api.web3forms.com/submit');
xhr.onreadystatechange=function(){
if(xhr.readyState!==XMLHttpRequest.DONE)return;
if(xhr.status===200){
var response=JSON.parse(xhr.responseText);
if(response.success){
document.getElementById('formSonuc').innerHTML='<div style="background:#d4edda;color:#155724;padding:15px;border-radius:8px;"><strong>✅ Basarili!</strong> Sonuclar gonderildi. Tesekkurler!</div>';
document.getElementById('formSonuc').style.display='block';
}else{
document.getElementById('formSonuc').innerHTML='<div style="background:#f8d7da;color:#721c24;padding:15px;border-radius:8px;"><strong>❌ Hata!</strong> '+response.message+'</div>';
document.getElementById('formSonuc').style.display='block';
}
}else{
document.getElementById('formSonuc').innerHTML='<div style="background:#f8d7da;color:#721c24;padding:15px;border-radius:8px;"><strong>❌ Hata!</strong> Sonuclar gonderilemedi. Lutfen tekrar deneyin.</div>';
document.getElementById('formSonuc').style.display='block';
}
};
xhr.send(formData);
}
showQ();
</script>
