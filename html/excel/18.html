<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Excel Eğitim - Sayfa Yönetimi</title>
    <style>
        :root { --excel-green: #217346; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 95%; max-width: 900px; margin-top: 10px; }
        
        .info-panel { background: #e0f2fe; border-left: 5px solid #0ea5e9; padding: 15px; margin-bottom: 20px; color: #0369a1; font-weight: 600; font-size: 15px; }
        
        /* Excel Grid (Pasif Görünüm) */
        .excel-frame { border: 1px solid #ccc; background: #fff; position: relative; opacity: 0.7; pointer-events: none; }
        .excel-table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); width: 100px; height: 32px; }
        .excel-table th { background: #f8fafc; }

        /* Sayfa Sekmeleri (Aktif Alan) */
        .sheet-tabs { display: flex; background: #f3f3f3; border: 1px solid #ccc; border-top: none; padding: 0 10px; height: 35px; align-items: flex-end; }
        .tab { 
            padding: 5px 20px; border: 1px solid #ccc; background: #fff; margin-right: 2px; 
            font-size: 13px; cursor: pointer; border-bottom: none; border-radius: 4px 4px 0 0;
            position: relative; transition: 0.2s;
        }
        .tab.active { border-top: 3px solid var(--excel-green); font-weight: bold; height: 28px; }
        .tab:hover { background: #f1f5f9; }

        /* Sekme Düzenleme Inputu */
        .tab-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid var(--excel-green); box-sizing: border-box;
            text-align: center; font-size: 13px; outline: none; z-index: 10;
        }

        .controls { margin-top: 20px; text-align: right; }
        button#nextBtn { padding: 10px 40px; background: var(--excel-green); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
    body,td,th {
    font-family: "Segoe UI", sans-serif;
    color: #030303;
}
a:link {
    color: #F9F2F2;
}
a:visited {
    color: #F5EFEF;
}
    </style>
</head>
<body>

<div class="container">
    <div class="info-panel" id="instruction">
        Yönerge: Alttaki <b>Sayfa1</b> sekmesinin üzerine <b>çift tıklayın</b>, ismini <b>senetler</b> olarak değiştirip <b>Enter</b>'a basın.
    </div>

    <div class="excel-frame">
        <table class="excel-table">
            <thead><tr><th style="width:45px;">◢</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead>
            <tbody>
                <tr><th>1</th><td></td><td></td><td></td><td></td></tr>
                <tr><th>2</th><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>

    <div class="sheet-tabs">
        <div class="tab active" id="sheetTab" ondblclick="editTabName()">
            <span id="tabText">Sayfa1</span>
        </div>
        <div class="tab" style="padding: 5px 10px; color: #666; cursor: default;">+</div>
    </div>

    <div class="controls">
        <button id="nextBtn" enable><a href="19.html" target="_parent">Sonraki Adım (19) →</a></button>
    </div>

</div>

<script>
    function editTabName() {
        const tab = document.getElementById('sheetTab');
        const textSpan = document.getElementById('tabText');
        
        // Eğer zaten input varsa tekrar oluşturma
        if (tab.querySelector('input')) return;

        const currentName = textSpan.innerText;
        const inp = document.createElement('input');
        inp.type = "text";
        inp.className = "tab-input";
        inp.value = currentName;
        
        tab.appendChild(inp);
        setTimeout(() => {
            inp.focus();
            inp.select();
        }, 10);

        inp.onkeydown = (e) => {
            if (e.key === "Enter") {
                const newName = inp.value.trim().toLowerCase();
                textSpan.innerText = inp.value; // Görsel olarak ne yazdıysa o kalsın
                inp.remove();

                if (newName === "senetler") {
                    document.getElementById('nextBtn').disabled = false;
                    document.getElementById('instruction').innerHTML = "Tebrikler! Sayfa adı başarıyla değiştirildi. Sonraki adıma geçebilirsiniz.";
                    document.getElementById('instruction').style.background = "#dcfce7";
                    document.getElementById('instruction').style.color = "#166534";
                    document.getElementById('instruction').style.borderLeftColor = "#22c55e";
                } else {
                    document.getElementById('instruction').innerHTML = "Hata: Sayfa adını tam olarak <b>senetler</b> yapmalısınız.";
                }
            }
            if (e.key === "Escape") {
                inp.remove();
            }
        };

        // Dışarı tıklayınca iptal etme (Excel davranışı)
        inp.onblur = () => {
            if (tab.contains(inp)) inp.remove();
        };
    }
</script>
</body>
</html>
