<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Excel Eğitim - Birleştir ve Ortala</title>
    <style>
        :root { --excel-green: #217346; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 95%; max-width: 900px; margin-top: 10px; }
        
        /* Ribbon Toolbar */
        .toolbar { display: flex; background: #f3f3f3; padding: 10px; border: 1px solid #ccc; gap: 15px; align-items: center; border-bottom: 2px solid #ddd; }
        .btn-tool { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11px; min-width: 100px; border-radius: 4px; transition: 0.2s; }
        .btn-tool:hover { background: #e2e8f0; border-color: var(--excel-green); }
        .btn-tool span { font-size: 20px; margin-bottom: 3px; }

        .info-panel { background: #eff6ff; border-left: 5px solid #3b82f6; padding: 15px; margin: 10px 0; color: #1e40af; font-weight: 600; font-size: 15px; }
        
        /* Excel Grid */
        .excel-frame { border: 1px solid #ccc; background: #fff; overflow: auto; }
        .excel-table { border-collapse: collapse; user-select: none; table-layout: fixed; width: 100%; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); width: 100px; height: 35px; text-align: center; font-size: 14px; position: relative; background: white; }
        .excel-table th { background: #f8fafc; color: #475569; font-weight: 500; }
        
        /* Seçim ve Birleştirme Efektleri */
        .selected { background-color: rgba(33, 115, 70, 0.1) !important; outline: 2px solid var(--excel-green); z-index: 10; }
        .merged-cell { background-color: #fff !important; font-weight: bold; font-size: 16px; color: var(--excel-green); }

        .controls { margin-top: 20px; text-align: right; }
        button#nextBtn { padding: 10px 40px; background: var(--excel-green); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
    body,td,th {
    font-family: "Segoe UI", sans-serif;
    color: #030303;
}
a:link {
    color: #F8F8F8;
}
a:visited {
    color: #F5F2F2;
}
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <button class="btn-tool" onclick="applyMerge()">
            <span>↔️</span> Birleştir ve Ortala
        </button>
        <div style="font-size: 12px; color: #666; margin-left: 10px;">Hizalama Grubu</div>
    </div>

    <div class="info-panel" id="instr">
        Yönerge: <b>B2, C2, D2 ve E2</b> hücrelerini fareyle sürükleyerek seçin. <br>
        Ardından yukarıdaki <b>Birleştir ve Ortala</b> butonuna tıklayın.
    </div>

    <div class="excel-frame">
        <table class="excel-table" id="grid">
            <thead>
                <tr><th style="width:45px;">◢</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div class="controls">
        <button id="nextBtn" enable><a href="24.html" target="_parent">Sonraki Adım (24) →</a></button>
    </div>

</div>

<script>
    let isMouseDown = false;
    let selectedIds = new Set();
    const targetCells = ["B2", "C2", "D2", "E2"];

    function init() {
        const body = document.getElementById('tbody');
        for (let r = 1; r <= 10; r++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<th>${r}</th>` + ['A','B','C','D','E'].map(c => {
                let id = c + r;
                let val = (id === "B2") ? "HAFTALIK ÇİZELGE" : "";
                return `<td id="${id}" onmousedown="startDrag('${id}')" onmouseover="doDrag('${id}')">${val}</td>`;
            }).join('');
            body.appendChild(tr);
        }
    }

    function startDrag(id) {
        isMouseDown = true;
        clearSelection();
        selectCell(id);
    }

    function doDrag(id) {
        if (isMouseDown) selectCell(id);
    }

    window.onmouseup = () => { isMouseDown = false; };

    function selectCell(id) {
        document.getElementById(id).classList.add('selected');
        selectedIds.add(id);
    }

    function clearSelection() {
        selectedIds.clear();
        document.querySelectorAll('td').forEach(td => td.classList.remove('selected'));
    }

    function applyMerge() {
        // Seçilen hücrelerin hedef aralığı (B2:E2) kapsayıp kapsamadığını kontrol et
        const isCorrectSelection = targetCells.every(id => selectedIds.has(id)) && selectedIds.size === targetCells.length;

        if (!isCorrectSelection) {
            alert("Lütfen sadece B2, C2, D2 ve E2 hücrelerini seçin.");
            return;
        }

        // Görsel Birleştirme İşlemi
        const mainCell = document.getElementById('B2');
        mainCell.colSpan = 4;
        mainCell.classList.add('merged-cell');
        
        // Diğer hücreleri gizle (Excel'deki birleşme mantığı)
        document.getElementById('C2').style.display = 'none';
        document.getElementById('D2').style.display = 'none';
        document.getElementById('E2').style.display = 'none';

        document.getElementById('nextBtn').disabled = false;
        document.getElementById('instr').innerHTML = "Tebrikler! Hücreler birleştirildi ve metin ortalandı. Başlık oluşturmak için harika bir yöntem!";
        document.getElementById('instr').style.background = "#dcfce7";
        document.getElementById('instr').style.color = "#166534";
    }

    init();
</script>
</body>
</html>
