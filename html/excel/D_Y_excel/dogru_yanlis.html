<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>EXCEL DOĞRU - YANLIŞ TESTİ</title>
<style>
:root{--primary:#27ae60;--success:#2ecc71;--error:#e74c3c;--bg:#f8f9fa;--warning:#f39c12}
body{font-family:sans-serif;background:var(--bg);margin:0;padding:20px}
.container{max-width:900px;margin:0 auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.cover{text-align:center;margin-bottom:15px;padding:10px;background:linear-gradient(135deg,#27ae60 0%,#1e8449 100%);border-radius:15px;color:white;min-height:auto}
.cover img{max-width:200px;border-radius:10px;margin-bottom:15px}
.question-box{background:#fff;padding:25px;border-radius:12px;border:2px solid #ddd;margin-bottom:20px}
.q-text{font-size:22px;font-weight:bold;margin-bottom:20px;color:#333}
.q-media{text-align:center;margin:20px 0}
.q-media img{max-width:100%;max-height:300px;border-radius:8px;cursor:pointer}
.q-media video{max-width:100%;max-height:300px;border-radius:8px}
.options{display:flex;gap:20px;justify-content:center;margin:30px 0}
.option-btn{padding:20px 50px;font-size:20px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;transition:all 0.3s}
.option-dogru{background:#2ecc71;color:white}
.option-dogru:hover{background:#27ae60;transform:scale(1.05)}
.option-yanlis{background:#e74c3c;color:white}
.option-yanlis:hover{background:#c0392b;transform:scale(1.05)}
.result-msg{text-align:center;padding:15px;border-radius:8px;margin:15px 0;font-weight:bold;font-size:18px}
.result-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.result-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.stats-box{background:#f8f9fa;padding:20px;border-radius:10px;margin-bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;text-align:center}
.stat-item{background:white;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.stat-value{font-size:28px;font-weight:bold}
.stat-label{font-size:12px;color:#666;margin-top:5px}
.stat-dogru{color:var(--success)}
.stat-yanlis{color:var(--error)}
.stat-toplam{color:var(--primary)}
.stat-eklenen{color:var(--warning)}
.progress-bar{background:#e9ecef;height:20px;border-radius:10px;overflow:hidden;margin:20px 0}
.progress-fill{background:var(--primary);height:100%;transition:width 0.3s}
#zoomModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
#zoomModal img{max-width:90%;max-height:90%}
.report-box{background:#d4edda;padding:30px;border-radius:12px;text-align:center;margin-top:30px}
.report-box h2{color:#155724;margin-bottom:20px}
.next-btn{background:var(--primary);color:white;padding:15px 40px;font-size:18px;border:none;border-radius:8px;cursor:pointer;margin-top:20px}
.next-btn:hover{background:#1e8449}
.hidden{display:none}
</style>
</head>

ddedAt":"02.05.2026 00:02:26"},{"id":1777669346283,"text":".XLSX BİR EXCEL DOSYA UZANTISIDIR.","imgData":"","vidData":"","answer":"D","addedAt":"02.05.2026 00:02:26"}];
var initialCount = 20;
var questions = [];
var currentQ = 0;
var dogruSayisi = 0;
var yanlisSayisi = 0;
var eklenenSoru = 0;
var nextLibIndex = initialCount % library.length;

// İlk soruları oluştur
for(var i=0;i<initialCount;i++){
    questions.push({...library[i % library.length], qNum: i+1});
}

function openZoom(src){
    document.getElementById('zoomImg').src=src;
    document.getElementById('zoomModal').style.display='flex';
}

function gosterSoru(){
    if(currentQ >= questions.length){
        showReport();
        return;
    }
    var q = questions[currentQ];
    document.getElementById('q-text').innerText = 'Soru ' + (currentQ+1) + ': ' + (q.text || '');
    
    var mediaHtml = '';
    if(q.imgData) mediaHtml += '<img src="' + q.imgData + '" onclick="openZoom(this.src)">';
    if(q.vidData) mediaHtml += '<video src="' + q.vidData + '" controls></video>';
    document.getElementById('q-media').innerHTML = mediaHtml;
    
    document.getElementById('result-area').innerHTML = '';
    updateProgress();
}

function updateProgress(){
    var pct = ((currentQ) / questions.length) * 100;
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('stat-toplam').innerText = questions.length;
}

function updateStats(){
    document.getElementById('stat-dogru').innerText = dogruSayisi;
    document.getElementById('stat-yanlis').innerText = yanlisSayisi;
    document.getElementById('stat-eklenen').innerText = eklenenSoru;
}

function cevapla(cevap){
    var q = questions[currentQ];
    var dogruMu = cevap === q.answer;
    
    if(dogruMu){
        dogruSayisi++;
        document.getElementById('result-area').innerHTML = '<div class="result-msg result-success">✅ Doğru! Sonraki soruya geçiliyor...</div>';
        updateStats();
        setTimeout(function(){
            currentQ++;
            gosterSoru();
        }, 1500);
    } else {
        yanlisSayisi++;
        // Yeni soru ekle
        var yeniSoru = {...library[nextLibIndex], qNum: questions.length + 1};
        questions.push(yeniSoru);
        eklenenSoru++;
        nextLibIndex = (nextLibIndex + 1) % library.length;
        
        document.getElementById('result-area').innerHTML = '<div class="result-msg result-error">❌ Yanlış! Yeni soru eklendi. Toplam ' + questions.length + ' soru oldu.</div>';
        updateStats();
        updateProgress();
        setTimeout(function(){
            currentQ++;
            gosterSoru();
        }, 2000);
    }
}

function showReport(){
    document.getElementById('question-area').classList.add('hidden');
    document.getElementById('report-area').classList.remove('hidden');
    
    var basariOrani = Math.round((dogruSayisi / questions.length) * 100);
    var html = '<div class="report-box">';
    html += '<h2>🎉 Sınav Tamamlandı!</h2>';
    html += '<div class="stats-box" style="margin:30px 0">';
    html += '<div class="stat-item"><div class="stat-value stat-dogru">' + dogruSayisi + '</div><div class="stat-label">Doğru Cevap</div></div>';
    html += '<div class="stat-item"><div class="stat-value stat-yanlis">' + yanlisSayisi + '</div><div class="stat-label">Yanlış Cevap</div></div>';
    html += '<div class="stat-item"><div class="stat-value stat-toplam">' + questions.length + '</div><div class="stat-label">Toplam Soru</div></div>';
    html += '<div class="stat-item"><div class="stat-value stat-eklenen">' + eklenenSoru + '</div><div class="stat-label">Eklenen Soru</div></div>';
    html += '</div>';
    html += '<p style="font-size:20px;margin:20px 0"><strong>Başarı Oranı:</strong> %' + basariOrani + '</p>';
    html += '<button class="next-btn" onclick="location.reload()">Yeniden Başla</button>';
    html += '</div>';
    
    document.getElementById('report-area').innerHTML = html;
}

gosterSoru();
</script>
