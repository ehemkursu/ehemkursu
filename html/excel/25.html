<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Excel Eğitim - Metin Yönlendirme</title>
    <style>
        :root { --excel-green: #217346; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 95%; max-width: 900px; margin-top: 10px; }
        
        /* Ribbon Toolbar */
        .toolbar { display: flex; background: #f3f3f3; padding: 10px; border: 1px solid #ccc; gap: 15px; align-items: center; border-bottom: 2px solid #ddd; }
        .btn-tool { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11px; min-width: 100px; border-radius: 4px; transition: 0.2s; }
        .btn-tool:hover { background: #e2e8f0; border-color: var(--excel-green); }
        .btn-tool span { font-size: 20px; margin-bottom: 3px; }

        .info-panel { background: #f0fdf4; border-left: 5px solid var(--excel-green); padding: 15px; margin: 10px 0; color: #166534; font-weight: 600; font-size: 15px; }
        
        /* Excel Grid */
        .excel-frame { border: 1px solid #ccc; background: #fff; overflow: auto; }
        .excel-table { border-collapse: collapse; user-select: none; table-layout: fixed; width: 100%; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); width: 100px; height: 35px; text-align: center; font-size: 13px; position: relative; background: white; transition: all 0.3s; }
        .excel-table th { background: #f8fafc; color: #475569; font-weight: 500; }
        
        /* Yönlendirme Efektleri */
        .rotated-text { 
            writing-mode: vertical-rl; 
            transform: rotate(180deg); 
            height: 120px !important; /* Hücre dikeyde uzar */
            vertical-align: middle;
            font-weight: bold;
            color: var(--excel-green);
        }

        .selected { outline: 2px solid var(--excel-green); z-index: 10; background-color: rgba(33, 115, 70, 0.05) !important; }

        .controls { margin-top: 20px; text-align: right; }
        button#finishBtn { padding: 12px 40px; background: #1e40af; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
    body,td,th {
    font-family: "Segoe UI", sans-serif;
    color: #000000;
}
a:link {
    color: #FFFFFF;
}
a:visited {
    color: #FFF8F8;
}
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <button class="btn-tool" onclick="applyOrientation()">
            <span>↗️</span> Yönlendirme
        </button>
        <div style="font-size: 12px; color: #666; margin-left: 10px;">Hizalama / Yön</div>
    </div>

    <div class="info-panel" id="instr">
        Yönerge: <b>A2, B2, C2, D2 ve E2</b> hücrelerini (başlık satırını) fareyle sürükleyerek seçin. <br>
        Ardından yukarıdaki <b>Yönlendirme</b> butonuna tıklayarak metinleri dikey konuma getirin.
    </div>

    <div class="excel-frame">
        <table class="excel-table" id="grid">
            <thead>
                <tr><th style="width:45px;">◢</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div class="controls">
        <button id="finishBtn" disabled onclick="completeTraining()">Eğitimi Tamamla 🎓</button>
    </div>
</div>

<script>
    let isMouseDown = false;
    let selectedIds = new Set();
    const headers = ["A2", "B2", "C2", "D2", "E2"];

    function init() {
        const body = document.getElementById('tbody');
        const headerTexts = ["TARİH", "AÇIKLAMA", "MİKTAR", "BİRİM FİYAT", "TOPLAM"];
        
        for (let r = 1; r <= 10; r++) {
            let tr = document.createElement('tr');
            tr.id = "tr-" + r;
            tr.innerHTML = `<th>${r}</th>` + ['A','B','C','D','E'].map((c, index) => {
                let id = c + r;
                let val = (r === 2) ? headerTexts[index] : "";
                return `<td id="${id}" onmousedown="startDrag('${id}')" onmouseover="doDrag('${id}')">${val}</td>`;
            }).join('');
            body.appendChild(tr);
        }
    }

    function startDrag(id) {
        isMouseDown = true;
        clearSelection();
        selectCell(id);
    }

    function doDrag(id) {
        if (isMouseDown) selectCell(id);
    }

    window.onmouseup = () => { isMouseDown = false; };

    function selectCell(id) {
        document.getElementById(id).classList.add('selected');
        selectedIds.add(id);
    }

    function clearSelection() {
        selectedIds.clear();
        document.querySelectorAll('td').forEach(td => td.classList.remove('selected'));
    }

    function applyOrientation() {
        // Başlık satırının seçili olup olmadığını kontrol et
        const isCorrectSelection = headers.every(id => selectedIds.has(id));

        if (!isCorrectSelection) {
            alert("Lütfen önce A2'den E2'ye kadar olan başlık hücrelerini seçin.");
            return;
        }

        // Görsel Yönlendirme İşlemi
        headers.forEach(id => {
            const cell = document.getElementById(id);
            cell.classList.add('rotated-text');
        });

        document.getElementById('finishBtn').disabled = false;
        document.getElementById('instr').innerHTML = "Mükemmel! Başlıklar dikey konuma getirildi. Böylece dar sütunlarda daha fazla veri görebilirsiniz.";
        document.getElementById('instr').style.background = "#dcfce7";
        document.getElementById('instr').style.color = "#166534";
        document.getElementById('instr').style.borderLeftColor = "#22c55e";
    }

    function completeTraining() {
        alert("TEBRİKLER!\n25 adımlık Excel Temel Eğitim Serisini başarıyla tamamladınız.\n\nEdremit Halk Eğitimi Merkezi");
        location.reload();
    }

    init();
</script>
</body>
</html>
