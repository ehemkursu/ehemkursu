    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin:0; min-height: 100vh;}
        .main { display: flex; gap: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); align-items: flex-start; }
        .sidebar { width: 160px; display: flex; flex-direction: column; border-right: 1px solid #eee; padding-right: 10px; }

        .target { position: absolute; min-width: 35px; height: 35px; border: 2px dashed #3498db; border-radius: 18px; transform: translate(-50%, -50%); background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #3498db; padding: 0 10px; font-size: 14px; white-space: nowrap; }

        .item:hover { color: #3498db; }
        
        /* Tamamlanınca açılan alt panel */
        #navFooter { display:none; margin-top:30px; width: 100%; max-width: 600px; text-align: center; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); animation: slideUp 0.5s ease; }
        .nav-btn { display: inline-block; padding: 12px 25px; margin: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .prev-link { background: #95a5a6; color: white; }
        .next-link { background: #27ae60; color: white; border: 2px solid #27ae60; }
        .next-link:hover { background: #219150; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
